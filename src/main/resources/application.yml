server:
  port: 8087

chatboot:
  jwt:
    secret: ${CHATBOOT_JWT_SECRET}
  storage-dir: ${STORAGE_DIR}
  ollama:
    base-url: ${CHATBOOT_OLLAMA_URL:http://localhost:11434}
    embedding-model: bge-m3
    chat-model: qwen3:8b
    connect-timeout: 5s
    read-timeout: 120s
  evidence:
    minimum-score: ${CHATBOOT_EVIDENCE_MINIMUM:1.01}

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    url: ${CHATBOOT_DB_URL:jdbc:postgresql://localhost:5436/chatboot}
    username: ${CHATBOOT_DB_USER:chatboot}
    password: ${CHATBOOT_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    ollama:
      base-url: ${chatboot.ollama.base-url}
      embedding:
        options:
          model: ${chatboot.ollama.embedding-model}
